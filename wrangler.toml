name = "verity-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]
# account_id: set via CLOUDFLARE_ACCOUNT_ID env var (Wrangler picks it up automatically).
# Discoverable via `wrangler whoami` once owner authenticates the local CLI.

# Bundled plan: cpu_ms > 10 requires the Bundled (paid) plan. Owner-decided
# 2026-05-13 to deploy on Bundled ($5/mo) for always-on Sentry init headroom
# (cold-start ~30-40ms p50). Free tier's 10ms ceiling is insufficient.
[limits]
cpu_ms = 50

# Production environment with custom domain. Routes are owner-managed:
# the CNAME mcp.verityskills.com -> <worker>.<account>.workers.dev must be
# added in Cloudflare DNS during Phase 4 of the rollout.
[env.production]
name = "verity-mcp"

[[env.production.routes]]
# Custom-domain routes pin the entire hostname to this Worker. The pattern
# is a bare hostname per Cloudflare's docs; path wildcards are not allowed
# when custom_domain is true (the Worker handles every path on the domain).
pattern = "mcp.verityskills.com"
custom_domain = true

# Preview environment uses the default <worker>.<account>.workers.dev URL.
# Used during Phase 3 for smoke-testing before DNS flip.
[env.preview]
name = "verity-mcp-preview"

# Observability: structured logs flow to the Cloudflare tail (`wrangler tail`).
# Sentry DSN is set as a Wrangler secret named SENTRY_DSN (not in this file).
[observability]
enabled = true

# VRT-166 OAuth 2.1 surface. Three Wrangler secrets gate the OAuth path:
#
#   SUPABASE_URL                  https URL of the Verity Supabase project. The
#                                  Worker uses this to hit the PostgREST
#                                  endpoint at ${SUPABASE_URL}/rest/v1/... for
#                                  the four mcp_oauth_* tables.
#   SUPABASE_SERVICE_ROLE_KEY     service-role JWT for the same project. RLS
#                                  bypass per Supabase default. Owner-set via
#                                  `wrangler secret put SUPABASE_SERVICE_ROLE_KEY`
#                                  AFTER PR merge and BEFORE the OAuth surface
#                                  is announced. Absence at request time
#                                  returns oauth_misconfigured 503 with a
#                                  Retry-After hint; vtk_* user-key path is
#                                  unaffected.
#   MCP_OAUTH_KILL_SWITCH         literal string 'on' disables every OAuth
#                                  endpoint (/.well-known/oauth-* omits OAuth
#                                  fields; /oauth/token returns 503;
#                                  validation of vto_* tokens at /mcp returns
#                                  503 OAUTH_KILLED). vtk_* path stays live.
#                                  Default off; owner toggleable without redeploy.
#
# None of the three are set here; all three live as Wrangler secrets per env.
# Section kept as documentation only so a future reviewer can grep "OAuth"
# in this file and find the wiring.
